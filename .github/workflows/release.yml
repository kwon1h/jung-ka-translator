name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow when tag starts with v, e.g. v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore GameOverlayTranslator.sln

    - name: Run Regression Harness
      run: dotnet run --project tests/GameOverlayTranslator.RegressionTests/GameOverlayTranslator.RegressionTests.csproj --configuration Release

    - name: Build Validated Release Executable
      shell: pwsh
      run: ./scripts/build-release.ps1

    - name: Create GitHub Release and Upload Executable
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/release/GameOverlayTranslator.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
